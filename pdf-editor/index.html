<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor - Visor y Editor de PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            min-width: 120px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }

        .stat-value.size {
            color: #4ade80;
        }

        .stat-value.size.warning {
            color: #fbbf24;
        }

        .stat-value.size.danger {
            color: #ef4444;
        }

        .size-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .size-bar {
            width: 60px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .size-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .size-bar-fill.warning {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .size-bar-fill.danger {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar - Thumbnails */
        .sidebar {
            width: 220px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }

        .thumbnails-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .thumbnail-item {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .thumbnail-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .thumbnail-item.active {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .thumbnail-item.deleted {
            opacity: 0.4;
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .thumbnail-item.deleted::after {
            content: 'ELIMINADA';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            background: #ef4444;
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .thumbnail-canvas {
            width: 100%;
            border-radius: 4px;
            display: block;
        }

        .thumbnail-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .thumbnail-number {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .thumbnail-delete {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .thumbnail-delete:hover {
            background: #ef4444;
            color: white;
        }

        .thumbnail-restore {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55a;
        }

        .thumbnail-restore:hover {
            background: #22c55a;
            color: white;
        }

        /* Viewer Area */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Upload Zone */
        .upload-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            border: 3px dashed rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 500px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.05);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .upload-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .upload-subtitle {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .upload-input {
            display: none;
        }

        /* PDF Viewer */
        .pdf-viewer {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .pdf-viewer.active {
            display: flex;
        }

        .page-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: auto;
            padding: 1rem;
        }

        #pdfCanvas {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        /* Navigation */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            margin-top: 1rem;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover:not(:disabled) {
            background: #e94560;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 1rem;
            font-weight: 500;
            padding: 0 1rem;
            min-width: 100px;
            text-align: center;
        }

        .delete-current-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .delete-current-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .delete-current-btn.restore {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        /* Actions */
        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .action-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: #22c55e;
            color: white;
            border-radius: 12px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #ef4444;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 160px;
            }

            .stats-bar {
                display: none;
            }

            .header {
                flex-wrap: wrap;
                gap: 1rem;
            }
        }

        /* Savings indicator */
        .savings-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">📄</div>
                <span class="logo-text">PDF Editor</span>
            </div>

            <div class="stats-bar" id="statsBar" style="display: none;">
                <div class="stat-item">
                    <span class="stat-label">Páginas</span>
                    <span class="stat-value" id="totalPages">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Eliminadas</span>
                    <span class="stat-value" id="deletedPages" style="color: #ef4444;">0</span>
                </div>
                <div class="stat-item" style="position: relative;">
                    <span class="stat-label">Tamaño Actual</span>
                    <div class="size-indicator">
                        <span class="stat-value size" id="currentSize">0 MB</span>
                    </div>
                    <div class="size-bar">
                        <div class="size-bar-fill" id="sizeBarFill"></div>
                    </div>
                    <div class="savings-badge" id="savingsBadge" style="display: none;">
                        -<span id="savingsPercent">0</span>%
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Original</span>
                    <span class="stat-value" id="originalSize" style="opacity: 0.6;">0 MB</span>
                </div>
            </div>

            <div class="header-actions">
                <button class="action-btn secondary" id="resetBtn" style="display: none;">
                    🔄 Reiniciar
                </button>
                <button class="action-btn primary" id="downloadBtn" style="display: none;">
                    💾 Descargar PDF
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar" style="display: none;">
                <div class="sidebar-header">
                    <span class="sidebar-title">📑 Páginas</span>
                </div>
                <div class="thumbnails-container" id="thumbnailsContainer">
                    <!-- Thumbnails will be generated here -->
                </div>
            </aside>

            <!-- Viewer Area -->
            <section class="viewer-area">
                <!-- Upload Zone -->
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📤</div>
                    <h2 class="upload-title">Sube tu PDF</h2>
                    <p class="upload-subtitle">Arrastra y suelta tu archivo aquí<br>o haz clic para seleccionar</p>
                    <input type="file" accept=".pdf" class="upload-input" id="fileInput">
                </div>

                <!-- PDF Viewer -->
                <div class="pdf-viewer" id="pdfViewer">
                    <div class="page-container">
                        <canvas id="pdfCanvas"></canvas>
                    </div>
                    <div class="nav-controls">
                        <button class="nav-btn" id="prevBtn">◀</button>
                        <span class="page-indicator">
                            <span id="currentPage">1</span> / <span id="pageCount">1</span>
                        </span>
                        <button class="nav-btn" id="nextBtn">▶</button>
                        <button class="delete-current-btn" id="deleteCurrentBtn">
                            🗑️ Eliminar página
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">Procesando PDF...</p>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // State
        let pdfDoc = null;
        let pdfBytes = null;
        let currentPage = 1;
        let totalPages = 0;
        let deletedPages = new Set();
        let originalSize = 0;
        let pageRenderQueue = [];

        // DOM Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const pdfViewer = document.getElementById('pdfViewer');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const thumbnailsContainer = document.getElementById('thumbnailsContainer');
        const sidebar = document.getElementById('sidebar');
        const statsBar = document.getElementById('statsBar');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const toast = document.getElementById('toast');

        // Event Listeners
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPDF(file);
            } else {
                showToast('Por favor, selecciona un archivo PDF', true);
            }
        });

        prevBtn.addEventListener('click', () => navigatePage(-1));
        nextBtn.addEventListener('click', () => navigatePage(1));
        deleteCurrentBtn.addEventListener('click', toggleDeleteCurrentPage);
        downloadBtn.addEventListener('click', downloadModifiedPDF);
        resetBtn.addEventListener('click', resetEditor);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!pdfDoc) return;
            if (e.key === 'ArrowLeft') navigatePage(-1);
            if (e.key === 'ArrowRight') navigatePage(1);
            if (e.key === 'Delete' || e.key === 'Backspace') toggleDeleteCurrentPage();
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                loadPDF(file);
            }
        }

        async function loadPDF(file) {
            showLoading('Cargando PDF...');

            try {
                const arrayBuffer = await file.arrayBuffer();
                pdfBytes = new Uint8Array(arrayBuffer);
                originalSize = pdfBytes.length;

                // Load with PDF.js for viewing
                pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
                totalPages = pdfDoc.numPages;
                currentPage = 1;
                deletedPages.clear();

                // Update UI
                uploadZone.style.display = 'none';
                pdfViewer.classList.add('active');
                sidebar.style.display = 'flex';
                statsBar.style.display = 'flex';
                downloadBtn.style.display = 'flex';
                resetBtn.style.display = 'flex';

                // Render current page and thumbnails
                await renderPage(currentPage);
                await generateThumbnails();
                updateStats();
                updateNavigation();

                hideLoading();
                showToast('PDF cargado correctamente');
            } catch (error) {
                console.error('Error loading PDF:', error);
                hideLoading();
                showToast('Error al cargar el PDF', true);
            }
        }

        async function renderPage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const canvas = pdfCanvas;
            const ctx = canvas.getContext('2d');

            // Calculate scale for good quality
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;

            // Update delete button state
            updateDeleteButton();
        }

        async function generateThumbnails() {
            thumbnailsContainer.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 0.3 });

                const item = document.createElement('div');
                item.className = 'thumbnail-item';
                item.dataset.page = i;
                if (i === currentPage) item.classList.add('active');
                if (deletedPages.has(i)) item.classList.add('deleted');

                const canvas = document.createElement('canvas');
                canvas.className = 'thumbnail-canvas';
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const ctx = canvas.getContext('2d');
                await page.render({
                    canvasContext: ctx,
                    viewport: viewport
                }).promise;

                const info = document.createElement('div');
                info.className = 'thumbnail-info';
                info.innerHTML = `
                    <span class="thumbnail-number">Página ${i}</span>
                    <button class="thumbnail-delete ${deletedPages.has(i) ? 'thumbnail-restore' : ''}" data-page="${i}">
                        ${deletedPages.has(i) ? '↩' : '×'}
                    </button>
                `;

                item.appendChild(canvas);
                item.appendChild(info);
                thumbnailsContainer.appendChild(item);

                // Click to navigate
                canvas.addEventListener('click', () => goToPage(i));

                // Delete/Restore button
                info.querySelector('.thumbnail-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    togglePageDelete(i);
                });
            }
        }

        function goToPage(pageNum) {
            if (pageNum >= 1 && pageNum <= totalPages) {
                currentPage = pageNum;
                renderPage(currentPage);
                updateNavigation();
                updateThumbnailsActive();
            }
        }

        function navigatePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                goToPage(newPage);
            }
        }

        function toggleDeleteCurrentPage() {
            togglePageDelete(currentPage);
        }

        function togglePageDelete(pageNum) {
            if (deletedPages.has(pageNum)) {
                deletedPages.delete(pageNum);
                showToast(`Página ${pageNum} restaurada`);
            } else {
                // Check if it's the last remaining page
                if (totalPages - deletedPages.size <= 1) {
                    showToast('Debes mantener al menos una página', true);
                    return;
                }
                deletedPages.add(pageNum);
                showToast(`Página ${pageNum} marcada para eliminar`);
            }

            updateThumbnailState(pageNum);
            updateDeleteButton();
            updateStats();
        }

        function updateThumbnailState(pageNum) {
            const item = thumbnailsContainer.querySelector(`[data-page="${pageNum}"]`);
            if (item) {
                const btn = item.querySelector('.thumbnail-delete');
                if (deletedPages.has(pageNum)) {
                    item.classList.add('deleted');
                    btn.classList.add('thumbnail-restore');
                    btn.textContent = '↩';
                } else {
                    item.classList.remove('deleted');
                    btn.classList.remove('thumbnail-restore');
                    btn.textContent = '×';
                }
            }
        }

        function updateThumbnailsActive() {
            document.querySelectorAll('.thumbnail-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.page) === currentPage) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        }

        function updateNavigation() {
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('pageCount').textContent = totalPages;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        function updateDeleteButton() {
            if (deletedPages.has(currentPage)) {
                deleteCurrentBtn.innerHTML = '↩ Restaurar página';
                deleteCurrentBtn.classList.add('restore');
            } else {
                deleteCurrentBtn.innerHTML = '🗑️ Eliminar página';
                deleteCurrentBtn.classList.remove('restore');
            }
        }

        async function updateStats() {
            document.getElementById('totalPages').textContent = totalPages - deletedPages.size;
            document.getElementById('deletedPages').textContent = deletedPages.size;

            // Calculate estimated size
            const estimatedSize = await calculateEstimatedSize();
            const sizeMB = (estimatedSize / (1024 * 1024)).toFixed(2);
            const originalMB = (originalSize / (1024 * 1024)).toFixed(2);

            document.getElementById('currentSize').textContent = `${sizeMB} MB`;
            document.getElementById('originalSize').textContent = `${originalMB} MB`;

            // Size bar and color
            const sizeRatio = estimatedSize / originalSize;
            const sizeBarFill = document.getElementById('sizeBarFill');
            sizeBarFill.style.width = `${sizeRatio * 100}%`;

            const currentSizeEl = document.getElementById('currentSize');
            currentSizeEl.classList.remove('warning', 'danger');
            sizeBarFill.classList.remove('warning', 'danger');

            // Savings badge
            const savingsBadge = document.getElementById('savingsBadge');
            const savingsPercent = document.getElementById('savingsPercent');

            if (deletedPages.size > 0) {
                const savings = ((1 - sizeRatio) * 100).toFixed(0);
                savingsPercent.textContent = savings;
                savingsBadge.style.display = 'block';
            } else {
                savingsBadge.style.display = 'none';
            }
        }

        async function calculateEstimatedSize() {
            if (deletedPages.size === 0) {
                return originalSize;
            }

            // Estimate based on pages removed (proportional)
            const remainingPages = totalPages - deletedPages.size;
            const estimatedSize = (originalSize * remainingPages) / totalPages;
            return estimatedSize;
        }

        async function downloadModifiedPDF() {
            if (deletedPages.size === 0) {
                // Download original
                downloadBlob(new Blob([pdfBytes], { type: 'application/pdf' }), 'documento.pdf');
                return;
            }

            showLoading('Generando PDF modificado...');

            try {
                // Use pdf-lib to remove pages
                const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);

                // Get pages to remove (in reverse order to maintain indices)
                const pagesToRemove = Array.from(deletedPages).sort((a, b) => b - a);

                for (const pageNum of pagesToRemove) {
                    pdfLibDoc.removePage(pageNum - 1); // pdf-lib uses 0-based index
                }

                const modifiedPdfBytes = await pdfLibDoc.save();

                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                downloadBlob(blob, 'documento_modificado.pdf');

                // Update actual size
                const actualSize = modifiedPdfBytes.length;
                const sizeMB = (actualSize / (1024 * 1024)).toFixed(2);
                document.getElementById('currentSize').textContent = `${sizeMB} MB`;

                hideLoading();
                showToast(`PDF descargado (${sizeMB} MB)`);
            } catch (error) {
                console.error('Error generating PDF:', error);
                hideLoading();
                showToast('Error al generar el PDF', true);
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetEditor() {
            pdfDoc = null;
            pdfBytes = null;
            currentPage = 1;
            totalPages = 0;
            deletedPages.clear();
            originalSize = 0;

            uploadZone.style.display = 'flex';
            pdfViewer.classList.remove('active');
            sidebar.style.display = 'none';
            statsBar.style.display = 'none';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            thumbnailsContainer.innerHTML = '';
            fileInput.value = '';

            showToast('Editor reiniciado');
        }

        function showLoading(text = 'Procesando...') {
            loadingText.textContent = text;
            loadingOverlay.classList.add('active');
        }

        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
